<svg xmlns="http://www.w3.org/2000/svg" class="w-full h-full" viewBox="0 0 800 800" style="background-color: #140f0c;">
  <defs>
    <pattern id="mosaic-tile-pattern" viewBox="-0.005 -0.005 800 800" height="30%" width="30%" patternUnits="userSpaceOnUse">
      
      <!-- Background / Base octagon -->
      <rect x="-1" y="-1" width="802" height="802" fill="#140f0c" stroke="none"></rect>

      <!-- Sub-Base patterns / Petal, octagon layers -->
      <!-- Class "sun" & "spears" -->
      <path d="M300,300L359.175,300L400,258.579L440.825,300L500,300L500,359.175L541.421,400L500,440.825L500,500L440.825,500L400,541.421L359.175,500L300,500L300,440.825L258.579,400L300,359.175L300,300" fill="#24866c"></path>
      
      <!-- Class "darts" 1-8 -->
      <path d="M158.579,300L300,300L300,359.175L258.579,400L158.579,300" fill="#ffffff" transform="rotate(0)" transform-origin="400 400"></path>
      <path d="M158.579,300L300,300L300,359.175L258.579,400L158.579,300" fill="#ffffff" transform="rotate(45)" transform-origin="400 400"></path>
      <path d="M158.579,300L300,300L300,359.175L258.579,400L158.579,300" fill="#ffffff" transform="rotate(90)" transform-origin="400 400"></path>
      <path d="M158.579,300L300,300L300,359.175L258.579,400L158.579,300" fill="#ffffff" transform="rotate(135)" transform-origin="400 400"></path>
      <path d="M158.579,300L300,300L300,359.175L258.579,400L158.579,300" fill="#ffffff" transform="rotate(180)" transform-origin="400 400"></path>
      <path d="M158.579,300L300,300L300,359.175L258.579,400L158.579,300" fill="#ffffff" transform="rotate(225)" transform-origin="400 400"></path>
      <path d="M158.579,300L300,300L300,359.175L258.579,400L158.579,300" fill="#ffffff" transform="rotate(270)" transform-origin="400 400"></path>
      <path d="M158.579,300L300,300L300,359.175L258.579,400L158.579,300" fill="#ffffff" transform="rotate(315)" transform-origin="400 400"></path>
      
      <!-- Petals 1-4 -->
      <path d="M117.157,117.157L217.157,75.736L300,158.579L300,300L158.579,300L75.736,217.157L117.157,117.157" fill="#24866c" transform="rotate(0)" transform-origin="400 400"></path>
      <path d="M117.157,117.157L217.157,75.736L300,158.579L300,300L158.579,300L75.736,217.157L117.157,117.157" fill="#24866c" transform="rotate(90)" transform-origin="400 400"></path>
      <path d="M117.157,117.157L217.157,75.736L300,158.579L300,300L158.579,300L75.736,217.157L117.157,117.157" fill="#24866c" transform="rotate(180)" transform-origin="400 400"></path>
      <path d="M117.157,117.157L217.157,75.736L300,158.579L300,300L158.579,300L75.736,217.157L117.157,117.157" fill="#24866c" transform="rotate(270)" transform-origin="400 400"></path>
      
      <!-- Spears -->
      <path d="M300,40.825L359.175,40.825L400,0L440.825,40.825L500,40.825L500,158.579L400,258.579L300,158.579L300,40.825" fill="#24866c" transform="rotate(0)" transform-origin="400 400"></path>
      <path d="M300,40.825L359.175,40.825L400,0L440.825,40.825L500,40.825L500,158.579L400,258.579L300,158.579L300,40.825" fill="#24866c" transform="rotate(90)" transform-origin="400 400"></path>
      <path d="M300,40.825L359.175,40.825L400,0L440.825,40.825L500,40.825L500,158.579L400,258.579L300,158.579L300,40.825" fill="#24866c" transform="rotate(180)" transform-origin="400 400"></path>
      <path d="M300,40.825L359.175,40.825L400,0L440.825,40.825L500,40.825L500,158.579L400,258.579L300,158.579L300,40.825" fill="#24866c" transform="rotate(270)" transform-origin="400 400"></path>
      
      <!-- Interlocking 5 Point "v_star" components -->
      <path d="M117.157,117.157L165.685,0L400,0L359.175,40.825L300,40.825L300,158.579L217.157,75.736L117.157,117.157" fill="#c5a17a" transform="rotate(0) scale(-1,1)" transform-origin="400 400"></path>
      <path d="M117.157,117.157L165.685,0L400,0L359.175,40.825L300,40.825L300,158.579L217.157,75.736L117.157,117.157" fill="#c5a17a" transform="rotate(0)" transform-origin="400 400"></path>
      <path d="M117.157,117.157L165.685,0L400,0L359.175,40.825L300,40.825L300,158.579L217.157,75.736L117.157,117.157" fill="#c5a17a" transform="rotate(90)" transform-origin="400 400"></path>
      <path d="M117.157,117.157L165.685,0L400,0L359.175,40.825L300,40.825L300,158.579L217.157,75.736L117.157,117.157" fill="#c5a17a" transform="rotate(90) scale(-1, 1)" transform-origin="400 400"></path>
      <path d="M117.157,117.157L165.685,0L400,0L359.175,40.825L300,40.825L300,158.579L217.157,75.736L117.157,117.157" fill="#c5a17a" transform="rotate(180) scale(-1,1)" transform-origin="400 400"></path>
      <path d="M117.157,117.157L165.685,0L400,0L359.175,40.825L300,40.825L300,158.579L217.157,75.736L117.157,117.157" fill="#c5a17a" transform="rotate(180)" transform-origin="400 400"></path>
      <path d="M117.157,117.157L165.685,0L400,0L359.175,40.825L300,40.825L300,158.579L217.157,75.736L117.157,117.157" fill="#c5a17a" transform="rotate(270)" transform-origin="400 400"></path>
      <path d="M117.157,117.157L165.685,0L400,0L359.175,40.825L300,40.825L300,158.579L217.157,75.736L117.157,117.157" fill="#c5a17a" transform="rotate(270) scale(-1, 1)" transform-origin="400 400"></path>
      
      <!-- Edge octagons -->
      <path d="M117.157,117.157L0,165.685L0,0L165.685,0L117.157,117.157" fill="#24866c" transform="rotate(0)" transform-origin="400 400"></path>
      <path d="M117.157,117.157L0,165.685L0,0L165.685,0L117.157,117.157" fill="#24866c" transform="rotate(90)" transform-origin="400 400"></path>
      <path d="M117.157,117.157L0,165.685L0,0L165.685,0L117.157,117.157" fill="#24866c" transform="rotate(180)" transform-origin="400 400"></path>
      <path d="M117.157,117.157L0,165.685L0,0L165.685,0L117.157,117.157" fill="#24866c" transform="rotate(270)" transform-origin="400 400"></path>
      
      <!-- Structural outline / grout -->
      <g id="quarter">
        <path d="M0,165.685L217.157,75.736L400,258.579L359.175,300L40.825,300L40.825,359.175L0,400" stroke="#19564b" stroke-width="9.5" stroke-linecap="square" fill="none"></path>
        <path d="M165.685,0L75.736,217.157L258.579,400L300,359.175L300,40.825L359.175,40.825L400,0" stroke="#19564b" stroke-width="9.5" stroke-linecap="square" fill="none"></path>
      </g>
      
      <use href="#quarter" transform="rotate(0)" transform-origin="400 400"></use>
      <use href="#quarter" transform="rotate(90)" transform-origin="400 400"></use>
      <use href="#quarter" transform="rotate(180)" transform-origin="400 400"></use>
      <use href="#quarter" transform="rotate(270)" transform-origin="400 400"></use>
    </pattern>
  </defs>
  
  <!-- Outer boundaries and repeating structural overlay -->
  <rect width="100%" height="100%" fill="url(#mosaic-tile-pattern)" stroke="none"></rect>
</svg>