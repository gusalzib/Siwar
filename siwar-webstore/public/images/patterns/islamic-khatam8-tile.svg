<svg xmlns="http://www.w3.org/2000/svg" class="w-full h-full" viewBox="0 0 800 800" style="background-color: #061f19;">
  <defs>
    <pattern id="tile-pattern-khatam8" viewBox="0 0 800 800" width="50%" height="50%" patternUnits="userSpaceOnUse">
      <!-- Ground plane -->
      <rect width="800" height="800" fill="#061f19" stroke="none"></rect>
      
      <g id="base-layer">
        <!-- Center 8-fold sun polygon -->
        <path d="M300,300L359.175,300L400,258.579L440.825,300L500,300L500,359.175L541.421,400L500,440.825L500,500L440.825,500L400,541.421L359.175,500L300,500L300,440.825L258.579,400L300,359.175L300,300" fill="#0e3a2f"></path>
        
        <!-- 8 Accent Darts -->
        <path d="M158.579,300L300,300L300,359.175L258.579,400L158.579,300" fill="#faebd7" transform="rotate(0)" transform-origin="400 400"></path>
        <path d="M158.579,300L300,300L300,359.175L258.579,400L158.579,300" fill="#faebd7" transform="rotate(45)" transform-origin="400 400"></path>
        <path d="M158.579,300L300,300L300,359.175L258.579,400L158.579,300" fill="#faebd7" transform="rotate(90)" transform-origin="400 400"></path>
        <path d="M158.579,300L300,300L300,359.175L258.579,400L158.579,300" fill="#faebd7" transform="rotate(135)" transform-origin="400 400"></path>
        <path d="M158.579,300L300,300L300,359.175L258.579,400L158.579,300" fill="#faebd7" transform="rotate(180)" transform-origin="400 400"></path>
        <path d="M158.579,300L300,300L300,359.175L258.579,400L158.579,300" fill="#faebd7" transform="rotate(225)" transform-origin="400 400"></path>
        <path d="M158.579,300L300,300L300,359.175L258.579,400L158.579,300" fill="#faebd7" transform="rotate(270)" transform-origin="400 400"></path>
        <path d="M158.579,300L300,300L300,359.175L258.579,400L158.579,300" fill="#faebd7" transform="rotate(315)" transform-origin="400 400"></path>
        
        <!-- Diagonal Petals -->
        <path d="M117.157,117.157L217.157,75.736L300,158.579L300,300L158.579,300L75.736,217.157L117.157,117.157" fill="#0e3a2f" transform="rotate(0)" transform-origin="400 400"></path>
        <path d="M117.157,117.157L217.157,75.736L300,158.579L300,300L158.579,300L75.736,217.157L117.157,117.157" fill="#0e3a2f" transform="rotate(90)" transform-origin="400 400"></path>
        <path d="M117.157,117.157L217.157,75.736L300,158.579L300,300L158.579,300L75.736,217.157L117.157,117.157" fill="#0e3a2f" transform="rotate(180)" transform-origin="400 400"></path>
        <path d="M117.157,117.157L217.157,75.736L300,158.579L300,300L158.579,300L75.736,217.157L117.157,117.157" fill="#0e3a2f" transform="rotate(270)" transform-origin="400 400"></path>
        
        <!-- Cardinal Spears -->
        <path d="M300,40.825L359.175,40.825L400,0L440.825,40.825L500,40.825L500,158.579L400,258.579L300,158.579L300,40.825" fill="#0e3a2f" transform="rotate(0)" transform-origin="400 400"></path>
        <path d="M300,40.825L359.175,40.825L400,0L440.825,40.825L500,40.825L500,158.579L400,258.579L300,158.579L300,40.825" fill="#0e3a2f" transform="rotate(90)" transform-origin="400 400"></path>
        <path d="M300,40.825L359.175,40.825L400,0L440.825,40.825L500,40.825L500,158.579L400,258.579L300,158.579L300,40.825" fill="#0e3a2f" transform="rotate(180)" transform-origin="400 400"></path>
        <path d="M300,40.825L359.175,40.825L400,0L440.825,40.825L500,40.825L500,158.579L400,258.579L300,158.579L300,40.825" fill="#0e3a2f" transform="rotate(270)" transform-origin="400 400"></path>
        
        <!-- 5-Point Interlocking Stars (v-stars) -->
        <path d="M117.157,117.157L165.685,0L400,0L359.175,40.825L300,40.825L300,158.579L217.157,75.736L117.157,117.157" fill="#2d7a52" transform="rotate(0) scale(-1,1)" transform-origin="400 400"></path>
        <path d="M117.157,117.157L165.685,0L400,0L359.175,40.825L300,40.825L300,158.579L217.157,75.736L117.157,117.157" fill="#2d7a52" transform="rotate(0)" transform-origin="400 400"></path>
        <path d="M117.157,117.157L165.685,0L400,0L359.175,40.825L300,40.825L300,158.579L217.157,75.736L117.157,117.157" fill="#2d7a52" transform="rotate(90)" transform-origin="400 400"></path>
        <path d="M117.157,117.157L165.685,0L400,0L359.175,40.825L300,40.825L300,158.579L217.157,75.736L117.157,117.157" fill="#2d7a52" transform="rotate(90) scale(-1, 1)" transform-origin="400 400"></path>
        <path d="M117.157,117.157L165.685,0L400,0L359.175,40.825L300,40.825L300,158.579L217.157,75.736L117.157,117.157" fill="#2d7a52" transform="rotate(180) scale(-1,1)" transform-origin="400 400"></path>
        <path d="M117.157,117.157L165.685,0L400,0L359.175,40.825L300,40.825L300,158.579L217.157,75.736L117.157,117.157" fill="#2d7a52" transform="rotate(180)" transform-origin="400 400"></path>
        <path d="M117.157,117.157L165.685,0L400,0L359.175,40.825L300,40.825L300,158.579L217.157,75.736L117.157,117.157" fill="#2d7a52" transform="rotate(270)" transform-origin="400 400"></path>
        <path d="M117.157,117.157L165.685,0L400,0L359.175,40.825L300,40.825L300,158.579L217.157,75.736L117.157,117.157" fill="#2d7a52" transform="rotate(270) scale(-1, 1)" transform-origin="400 400"></path>
        
        <!-- Corner Octagons -->
        <path d="M117.157,117.157L0,165.685L0,0L165.685,0L117.157,117.157" fill="#0e3a2f" transform="rotate(0)" transform-origin="400 400"></path>
        <path d="M117.157,117.157L0,165.685L0,0L165.685,0L117.157,117.157" fill="#0e3a2f" transform="rotate(90)" transform-origin="400 400"></path>
        <path d="M117.157,117.157L0,165.685L0,0L165.685,0L117.157,117.157" fill="#0e3a2f" transform="rotate(180)" transform-origin="400 400"></path>
        <path d="M117.157,117.157L0,165.685L0,0L165.685,0L117.157,117.157" fill="#0e3a2f" transform="rotate(270)" transform-origin="400 400"></path>
      </g>
      
      <!-- Strapwork Outlines -->
      <g id="quarter-khatam">
        <path d="M0,165.685L217.157,75.736L400,258.579L359.175,300L40.825,300L40.825,359.175L0,400" stroke="#d4af37" stroke-width="8" stroke-linecap="square" fill="none"></path>
        <path d="M165.685,0L75.736,217.157L258.579,400L300,359.175L300,40.825L359.175,40.825L400,0" stroke="#d4af37" stroke-width="8" stroke-linecap="square" fill="none"></path>
      </g>
      <use href="#quarter-khatam" transform="rotate(0)" transform-origin="400 400"></use>
      <use href="#quarter-khatam" transform="rotate(90)" transform-origin="400 400"></use>
      <use href="#quarter-khatam" transform="rotate(180)" transform-origin="400 400"></use>
      <use href="#quarter-khatam" transform="rotate(270)" transform-origin="400 400"></use>
      
    </pattern>
  </defs>

  <!-- Pattern Tessellation Base Canvas -->
  <rect width="100%" height="100%" fill="url(#tile-pattern-khatam8)" stroke="none"></rect>
  
      <!-- Transparent Overlay Layer -->
      <rect width="100%" height="100%" fill="#0a0a0d" opacity="1.00" style="mix-blend-mode: overlay; pointer-events: none;"></rect>
      
</svg>